services:
  - type: web
    name: everhere-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile --ignore-scripts && cd packages/shared && npx tsc && cd ../../apps/api && npx prisma generate --schema=./prisma/schema.prisma && npx tsc
    startCommand: cd apps/api && npx prisma db push --accept-data-loss --schema=./prisma/schema.prisma && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_HOURS
        value: 12
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: everhere-db
    plan: free
    databaseName: everhere
