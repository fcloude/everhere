services:
  - type: web
    name: everhere-api
    runtime: node
    plan: free
    buildCommand: cd apps/api && npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm db:generate && pnx db:migrate:prod
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: everhere-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_HOURS
        value: 12
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: everhere-db
    plan: free
    databaseName: everhere
